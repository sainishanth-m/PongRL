# Default configuration
device: "cpu"
seed: 42
algorithm: "dqn"
env_id: "ALE/Pong-v5"

training:
  total_timesteps: 1000000
  learning_rate: 0.0001
  batch_size: 32
  gamma: 0.99
  max_grad_norm: 0.5
  eval_freq: 10000
  eval_episodes: 5
  save_freq: 50000
  log_freq: 100

env:
  frameskip: 4
  stack_size: 4
  grayscale: true
  resize_shape: [84, 84]
  reward_clipping: true
