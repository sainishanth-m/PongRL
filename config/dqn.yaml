# DQN specific configuration
algorithm: "dqn"
training:
  learning_rate: 0.0001
  batch_size: 32
  gamma: 0.99
  target_update_freq: 1000
  learning_starts: 10000
  train_freq: 4
  buffer_size: 100000
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.01
  exploration_fraction: 0.1

model:
  hidden_size: 512
